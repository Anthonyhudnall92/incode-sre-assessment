name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for the workflow token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform fmt / validate / tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.12.0"

      - name: fmt
        run: terraform fmt -check -recursive

      - name: validate (bootstrap)
        run: |
          terraform -chdir=bootstrap init -backend=false -input=false
          terraform -chdir=bootstrap validate

      - name: validate (main stack)
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

      - name: validate (addons)
        run: |
          terraform -chdir=addons init -backend=false -input=false
          terraform -chdir=addons validate

      - uses: terraform-linters/setup-tflint@v4

      - name: tflint
        env:
          # Authenticated plugin downloads: anonymous GitHub API calls from
          # shared runners hit the rate limit and failed the job (#19).
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive --format compact

  security-scan:
    name: IaC / manifest / Dockerfile scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans the PR's commit range, which needs full history.
          fetch-depth: 0

      # Scan the chart exactly as Argo CD renders it, with placeholder values
      # standing in for the environment ones addons/ supplies.
      - name: render chart
        run: |
          helm lint deploy/charts/uptime -f deploy/charts/ci-values.yaml
          mkdir -p rendered
          helm template uptime deploy/charts/uptime -n uptime \
            -f deploy/charts/ci-values.yaml > rendered/uptime.yaml

      - name: kubeconform (schema validation)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary -ignore-missing-schemas rendered/

      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          config_file: .checkov.yaml
          # Console output only. The default (SARIF) writes results.sarif as
          # root, which the gitleaks step then cannot overwrite.
          output_format: cli

      - name: gitleaks (no secrets in history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  app:
    name: App tests + image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: unit tests
        working-directory: app
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -v

      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

      - name: build image
        run: docker build -t demo-app:ci app

      - name: trivy image scan (fail on fixable HIGH/CRITICAL)
        # Pinned by commit: a tag can be moved to different code, a SHA cannot.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: demo-app:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
