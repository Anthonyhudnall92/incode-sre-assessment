name: terraform-plan

# Plans the main stack on every pull request that can change it, and posts a
# summary (resources and actions, no values) on the PR. Read-only: runs as
# sre-demo-github-plan, which cannot write anything.

on:
  pull_request:
    paths:
      - "terraform/**"
      - "scripts/ci/**"
      - ".github/workflows/terraform-*.yml"

permissions:
  contents: read
  id-token: write      # exchange GitHub's OIDC token for AWS credentials
  pull-requests: write # post the plan summary

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    name: Terraform plan
    # Pull requests from forks get no OIDC token or secrets. Never run them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.9
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          role-session-name: pr-${{ github.event.pull_request.number }}-plan
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Write Terraform config from secrets
        env:
          TF_BACKEND_CONFIG: ${{ secrets.TF_BACKEND_CONFIG }}
          TF_VARS: ${{ secrets.TF_VARS }}
        run: scripts/ci/terraform-config.sh

      - name: terraform init
        run: terraform -chdir=terraform init -input=false -backend-config=backend.hcl >/dev/null

      - name: terraform plan
        id: plan
        run: scripts/ci/terraform-plan.sh

      - name: Post the plan summary on the PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- terraform-plan -->";
            const body = `${marker}\n${fs.readFileSync(`${process.env.RUNNER_TEMP}/plan-summary.md`, "utf8")}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
