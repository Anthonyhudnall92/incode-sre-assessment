# IRSA: pods using this ServiceAccount receive short-lived credentials for an
# IAM role that can read ONE Secrets Manager secret. No static AWS keys.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "roleArn is required" .Values.roleArn }}
    eks.amazonaws.com/sts-regional-endpoints: "true"
automountServiceAccountToken: false
