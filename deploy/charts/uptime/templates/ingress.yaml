# Internet-facing ALB managed by the AWS Load Balancer Controller. With a
# certificate it serves HTTPS only (HTTP redirects); with a web ACL, WAF
# filters every request. ExternalDNS points ingress.host at this ALB.
{{- $ing := .Values.ingress }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    {{- $attrs := list "routing.http.drop_invalid_header_fields.enabled=true" "deletion_protection.enabled=false" }}
    {{- with $ing.accessLogs.bucket }}
    {{- $attrs = append $attrs "access_logs.s3.enabled=true" }}
    {{- $attrs = append $attrs (printf "access_logs.s3.bucket=%s" .) }}
    {{- $attrs = append $attrs (printf "access_logs.s3.prefix=%s" $ing.accessLogs.prefix) }}
    {{- end }}
    alb.ingress.kubernetes.io/load-balancer-attributes: {{ join "," $attrs }}
    # Drain a departing pod for 30 s (default 300), within its preStop + grace.
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
    {{- if $ing.certificateArn }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: {{ $ing.certificateArn }}
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    {{- else }}
    # No certificate configured: plain HTTP (documented exception).
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    {{- end }}
    {{- with $ing.wafAclArn }}
    alb.ingress.kubernetes.io/wafv2-acl-arn: {{ . }}
    {{- end }}
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  name: http
      {{- with $ing.host }}
      host: {{ . }}
      {{- end }}
