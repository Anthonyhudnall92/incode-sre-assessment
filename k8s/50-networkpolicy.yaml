# Enforced by the VPC CNI network policy agent (enableNetworkPolicy=true).
#
# 1. Default deny all ingress and egress in the namespace.
# 2. Allow in:  TCP 8080 from inside the VPC (ALB nodes in public subnets
#               and kubelet health probes on the node IPs).
# 3. Allow out: DNS to CoreDNS, PostgreSQL to the database subnets only,
#               HTTPS for AWS APIs (STS, Secrets Manager), except IMDS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: ${APP_NAMESPACE}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ${APP_NAME}-allow
  namespace: ${APP_NAMESPACE}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ${APP_NAME}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - ipBlock:
            cidr: ${VPC_CIDR}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # PostgreSQL, database subnets only
    - to:
${DB_EGRESS_PEERS}
      ports:
        - protocol: TCP
          port: 5432
    # AWS APIs over TLS (via NAT). Tighten with VPC interface endpoints - see README.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
              - ${VPC_CIDR}
      ports:
        - protocol: TCP
          port: 443
