# Pod Security Admission "restricted" is ENFORCED: any pod that is privileged,
# runs as root, allows privilege escalation, keeps capabilities or lacks a
# seccomp profile is rejected by the API server.
apiVersion: v1
kind: Namespace
metadata:
  name: ${APP_NAMESPACE}
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    # ALB controller injects readiness gates so a rollout only proceeds once
    # new pods are healthy in the ALB target group (zero-downtime deploys).
    elbv2.k8s.aws/pod-readiness-gate-inject: enabled
